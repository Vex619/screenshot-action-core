[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "screenshot-action-core"
version = "0.2.0"
description = "Turn screenshot content into structured, actionable data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vex619" }]
keywords = ["screenshot", "ocr", "automation", "information-extraction", "nlp", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "build>=1.2"]
ocr = ["Pillow>=10.0", "pytesseract>=0.3.13"]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx2>=2.0",
]

[project.scripts]
screenshot-action = "screenshot_action.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/screenshot_action"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
